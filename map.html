/* Live map. The map itself is always the light Signalbox style, so the train icons use
   fixed status colours tuned for it; the panel and nav follow the brand theme.
   Dials: VARIANCE 4, MOTION 3, DENSITY 6. */
:root{
  --ontime:#16a35a; --late:#f2c200; --verylate:#e0453b; --unknown:#7a8594;
  --route:#ff8a00; --route-casing:#3a2200;
}
html,body{height:100%}
body{overflow:hidden}
#map{position:absolute;top:56px;left:0;right:0;bottom:0;background:#fff}
.base-tiles{filter:grayscale(1) brightness(1.06) contrast(.85)}

#panel{position:absolute;z-index:1000;top:72px;left:16px;width:340px;max-height:calc(100% - 88px);
  display:flex;flex-direction:column;overflow:hidden;
  background:color-mix(in srgb,var(--panel) 94%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#panel header{padding:16px 16px 12px}
#grab{display:none}
#panel h1{font-size:19px;letter-spacing:-.02em;font-weight:680}
#panel .sub{margin-top:4px;font:450 12.5px/1.4 var(--font-num);color:var(--ink-3)}
#panel .tabs{display:flex;gap:6px;margin-bottom:14px}
#panel .tabs #toggle{margin-left:auto}
#panel .tabs .chip{padding:0 10px}
#panel #dep-op{height:38px;font-size:14px}
/* One train, opened from a Next train tile: your trip and every stop's time. */
#panel.trip-mode .tabs,#panel.trip-mode .legend{display:none}
#trip-back{margin-bottom:12px}
#panel .trip-sub{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font:500 13.5px/1.35 var(--font-ui);color:var(--ink-3)}
#panel .trip-sub .t{font:680 22px/1 var(--font-num);color:var(--ink-1)}
#panel .trip-sub .st{font-weight:650}
#panel .trip-sub .recentre{order:9;height:28px;font-size:12px}
#panel .trip-sub .now{font:600 12px/1 var(--font-num);color:var(--ink-4);margin-left:auto}
#trip-stops{list-style:none;margin:0;padding:6px 0 10px;overflow-y:auto;border-top:1px solid var(--line)}
#trip-stops li{position:relative;display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:10px;align-items:baseline;
  padding:9px 16px 9px 34px}
#trip-stops li::before{content:"";position:absolute;left:18px;top:0;bottom:0;width:2px;background:var(--route,#ff8a00)}
#trip-stops li:first-child::before{top:50%} #trip-stops li:last-child::before{bottom:50%}
#trip-stops li::after{content:"";position:absolute;left:14px;top:calc(50% - 5px);width:10px;height:10px;border-radius:50%;
  background:var(--panel);border:2px solid var(--route,#ff8a00);box-sizing:border-box}
#trip-stops li.been{color:var(--ink-4)} #trip-stops li.been::after{background:var(--route,#ff8a00)}
#trip-stops li.next::after{box-shadow:0 0 0 4px color-mix(in srgb,var(--route,#ff8a00) 30%,transparent)}
#trip-stops li.yours .n{font-weight:700;color:var(--ink-1)}
#trip-stops li.outside{opacity:.55}
#trip-stops .tm{font:650 14px/1.2 var(--font-num)}
#trip-stops .tm s{display:block;font-size:11.5px;font-weight:450;color:var(--ink-4)}
#trip-stops .tm.late{color:var(--st-late)}
#trip-stops .n{font-size:14px}
#trip-stops .tag{display:block;font:600 11px/1.3 var(--font-ui);letter-spacing:.04em;text-transform:uppercase;color:var(--signal-ink);margin-top:2px}
#trip-stops .pl{font:500 12px/1 var(--font-num);color:var(--ink-3)}
#panel .near-row{display:flex;align-items:center;gap:10px;margin-top:10px;min-height:30px}

#panel .pick{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px;margin-top:12px;align-items:end}

  #toggle{display:inline-flex;float:right}

<script>
// On the published static site, data comes from JSON files written by
// nrfeeds.publish instead of the live API, and private pages are hidden.
const STATIC = document.documentElement.dataset.static === "1";
const staticFile = path => {
  const url = new URL(path, location.origin);
  const q = url.searchParams;
  switch (url.pathname) {
    case "/api/board": return `data/${q.get("kind") === "arrivals" ? "arrivals" : "board"}-${(q.get("station") || "BCS").toUpperCase()}.json`;
    case "/api/route": return `data/routes/${encodeURIComponent(q.get("train_id") || "")}.json`;
    default: return `data/${url.pathname.slice(5)}.json`;       // /api/trains -> data/trains.json
  }
};
// Every station also has an hourly, slimmed board in data/all/, used when
// there's no full one. Slim boards list later stops as [CRS, "HH:MM" UTC].
window.stationNames = window.stationNames || new Map();
function unslim(data) {
  if (!data.slim) return data;
  for (const d of data.departures) {
    d.calls = d.calls || [];
    d.warnings = d.warnings || [];
    d.calls_before = d.calls_before || [];
    d.calls_after = (d.calls_after || []).map(([crs, hm]) => {
      let planned = `${d.planned.slice(0, 11)}${hm}:00+00:00`;
      if (new Date(planned) < new Date(d.planned)) planned = new Date(new Date(planned).getTime() + 864e5).toISOString();
      return { crs, name: stationNames.get(crs) || crs, planned };
    });
  }
  return data;
}
async function getJSON(path, options = {}) {
  if (!STATIC) return (await fetch(path, options)).json();
  // The published site: live from the server when it's up, else the snapshot.
  const live = await liveJSON(path);
  if (live) return live;
  if (path.startsWith("/api/board")) {
    window.fullBoards = window.fullBoards ||
      fetch("data/config.json", { cache: "no-store" }).then(r => r.json()).then(c => new Set(c.full || []));
    const station = (new URL(path, location.origin).searchParams.get("station") || "BCS").toUpperCase();
    const file = staticFile(path);
    const res = await fetch((await fullBoards).has(station) ? file : file.replace("data/", "data/all/"),
                            { cache: "no-store" });
    return unslim(await res.json());
  }
  const data = await (await fetch(staticFile(path), { cache: "no-store" })).json();
  return data;
}

// The live server has new positions every few seconds; the published copy only
// every few minutes, and in between trains move by themselves (see glide).
// (On the published site that's live from the server too, when it's up; the
// snapshot it falls back on only changes every few minutes, so no faster than a minute.)
const REFRESH_MS = 10000;
let snapshotAt = 0;
const VERY_LATE_MINUTES = 10;
const css = getComputedStyle(document.documentElement);
const colour = name => css.getPropertyValue(`--${name}`).trim();

const map = L.map("map", { zoomControl: false });
L.control.zoom({ position: "topright" }).addTo(map);
// The Signalbox-style base map: OpenFreeMap's vector tiles (no key needed),
// recoloured here.
const ATTRIBUTION = '<a href="https://openfreemap.org">OpenFreeMap</a> ' +
  '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> | ' +
  "Train data: Network Rail | Stations: NaPTAN (DfT)";
const SIGNALBOX = {
  background: "#ffffff", water: "#b9d3e0", park: "#cfe6df", building: "#d3e2ea",
  residential: "#f6f9fa", road: "#45b7cc", minorRoad: "#a9dde6", casing: null, rail: "#34495a",
  label: "#2b3a45", halo: "#ffffff",
};

function recolour(style, p) {
  for (const l of style.layers) {
    const id = l.id, paint = (l.paint = l.paint || {});
    const hide = () => { (l.layout = l.layout || {}).visibility = "none"; };
    // The styles' own railways only appear when zoomed right in; they're
    // replaced by the layer added below.
    if (l.type === "line" && /rail/.test(id)) { hide(); continue; }
    if (id === "background" && p.background) paint["background-color"] = p.background;
    if (id === "water" && p.water) paint["fill-color"] = p.water;
    if (/^(park|landcover_wood)$/.test(id) && p.park) paint["fill-color"] = p.park;
    if (id === "building" && p.building) paint["fill-color"] = p.building;
    if (id === "landuse_residential" && p.residential) paint["fill-color"] = p.residential;
    if (p.road && l.type === "line" && /^(highway|tunnel_motorway|road_)/.test(id)) {

      if (minor) paint["line-width"] = ["interpolate", ["linear"], ["zoom"], 11, 0.5, 14, 1.5, 18, 6];
    }

function delayClass(t) {

  if (t.delay_minutes <= 0) return "ontime";      // on time or early

function delayText(t) {

const time = iso => iso ? new Date(iso).toLocaleTimeString("en-GB",

    const t = trainsById.get(tid);

  // ready, so it never blinks out. Another train: clear it now.

  if (routeGeo?.id !== id) { routeGeo = null; focusOverride = id === tripTrain ? tripFocus : null; }
  if (!id) { applyFocus(); return; }

    ]).addTo(map);

function stopText(c) {

// expected (or due).
// ---- The trip panel: one train, from where you get on to where you get off ----
// ---- Following a trip: the map stays close in on the train ----

  const at = calls.reduce((k, c, n) => (c.passed || c.here ? n : k), -1);
  const c = calls[at >= 0 ? at : Math.max(0, calls.findIndex(c => c.crs === tripOn))];

}

  const key = Math.floor(along / STEP_M);
  if (!force && (userMoved || key === sectionShown)) return;
  sectionShown = key;
  const bounds = L.latLngBounds([pos]);
  routeGeo.along.forEach((a, i) => {

// Your own drags, pinches and scrolls count as moving the map; ours don't.

const RESUME_MS = 20000;
let movedAt = 0;
const youMoved = () => { userMoved = true; movedAt = Date.now(); };

// Following a train: keep it in the middle of the part of the map you can

function keepTrainCentred() {
  if (!tripMode || selected !== tripTrain) return;
  if (userMoved && Date.now() - movedAt < RESUME_MS) return;
  userMoved = false;
  const m = markers.get(tripTrain);
  if (!m || !trainsById.has(tripTrain)) return;
  const size = map.getSize(), pad = panelPadding();
  const tl = pad.paddingTopLeft || [0, 0], br = pad.paddingBottomRight || [0, 0];
  const centre = L.point((tl[0] + size.x - br[0]) / 2, (tl[1] + size.y - br[1]) / 2);
  const at = map.latLngToContainerPoint(m.getLatLng());
  const off = at.subtract(centre);
  if (Math.abs(off.x) < 12 && Math.abs(off.y) < 12) return;          // near enough: no jiggle

function showTrip(route) {

  const onAt = tripOn ? Math.max(0, calls.findIndex(c => c.crs === tripOn)) : here;

function stopWhen(c) {

function stopTime(c, isNext) {

function stopTimeClass(c, isNext) {

// ---- Only the trains that could hold up the selected one ----
// Distances in metres on a flat projection, fine at these scales.
function flat(lat, lon, lat0) {
  const r = Math.PI / 180;
  return [lon * r * 6371000 * Math.cos(lat0 * r), lat * r * 6371000];
}
function shape(points) {
  const lat0 = points[0][0], xy = points.map(p => flat(p[0], p[1], lat0));
  const along = [0];
  for (let i = 1; i < xy.length; i++) along.push(along[i - 1] + Math.hypot(xy[i][0] - xy[i - 1][0], xy[i][1] - xy[i - 1][1]));
  return { lat0, xy, along, bounds: L.latLngBounds(points) };
}
// How far a point is from the line, how far along it, and which way the line runs there.
function project(geo, lat, lon) {
  const [px, py] = flat(lat, lon, geo.lat0);
  let best = { dist: Infinity, along: 0, bearing: 0 };
  for (let i = 1; i < geo.xy.length; i++) {
    const [ax, ay] = geo.xy[i - 1], [bx, by] = geo.xy[i];
    const dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy;
    const f = len2 ? Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / len2)) : 0;
    const d = Math.hypot(px - (ax + f * dx), py - (ay + f * dy));
    if (d < best.dist) best = { dist: d, along: geo.along[i - 1] + f * Math.sqrt(len2),
                                bearing: (Math.atan2(dx, dy) * 180 / Math.PI + 360) % 360 };
  }
  return best;
}
const ON_LINE_M = 300;        // this close to the line counts as on it

  const mine = me ? project(routeGeo, me.lat, me.lon).along : 0;
  const p = project(routeGeo, t.lat, t.lon);
  if (p.dist > ON_LINE_M || p.along < mine - 100) return false;
  if (t.heading != null) {
    const turn = Math.abs(((t.heading - p.bearing) % 360 + 540) % 360 - 180);
    return turn < 60;
  }
  // Standing still: going our way if it's heading for a stop still ahead of it.
  const ahead = new Set(routeGeo.calls.filter(c => c.lat != null && project(routeGeo, c.lat, c.lon).along > p.along)
    .map(c => c.name));
  return ahead.has(t.next_location) || ahead.has(t.destination);
}
function focusing() { return !!(routeGeo && selected && focusMode() !== "all"); }
function keepTrain(t) {
  return !focusing() || t.train_id === selected || (focusMode() === "ahead" && aheadOnLine(t));
}
function applyFocus() {
  const on = focusing(), mode = focusMode();
  let shown = 0;
  const kept = new Map();
  const keeps = id => {
    if (!kept.has(id)) { const t = trainsById.get(id); kept.set(id, !!(t && keepTrain(t))); }
    return kept.get(id);
  };
  for (const [id, m] of markers) {
    const keep = !on || keeps(id);
    shown += keep && id !== selected ? 1 : 0;
    const el = m.getElement();
    if (el) el.style.display = keep ? "" : "none";
    if (!keep && m.isPopupOpen()) m.closePopup();
  }
  document.querySelectorAll("#list > li").forEach(li => { li.hidden = on && !keeps(li.dataset.id); });
  showNetwork(!(routeGeo && selected) || ttSettings.get("map_network"));
  const chip = document.getElementById("focus");
  chip.hidden = !routeGeo || !selected;
  document.getElementById("focus-text").textContent = mode === "all" ? "Showing every train"
    : mode === "mine" ? (selected === myTrain?.train_id ? "Your train" : "Only this train")
    : shown ? `${shown} train${shown === 1 ? "" : "s"} ahead on this line` : "No trains ahead on this line";
  document.getElementById("focus-toggle").textContent = mode === "all" ? (tripMode ? "Only this train" : "Only those ahead") : "Show all trains";
}
document.getElementById("focus-toggle").onclick = e => {

};

function render(data) {
  showError(data.error);
  const trains = data.trains || [];
  trainsById = new Map(trains.map(t => [t.train_id, t]));

  for (const t of trains) {
    let m = markers.get(t.train_id);
    if (!m) {
      m = L.marker([t.lat, t.lon]).addTo(map);
      m.on("click", () => openTrip(t.train_id));
      markers.set(t.train_id, m);
    }
    const at = onBoard(t) || glidePosition(t) || t;     // where it is now, not when the data was made
    m.setLatLng([at.lat, at.lon]).setIcon(icon(t));
    // Pan so the whole popup shows, clear of the nav bar.
    m.bindPopup(popupHtml(t), { autoPanPaddingTopLeft: [16, 72], autoPanPaddingBottomRight: [16, 16] });
    if (m.isPopupOpen()) m.setPopupContent(popupHtml(t));
  }
  for (const [id, m] of markers) {
    if (!trainsById.has(id)) { map.removeLayer(m); markers.delete(id); }
  }
  // A train picked from Departures may only now have come into view.
  if (pendingPopup && trainsById.has(pendingPopup)) {
    markers.get(pendingPopup)?.openPopup();
    pendingPopup = null;
  }

  const list = document.getElementById("list");
  list.replaceChildren(...trains.map(t => {
    const li = document.createElement("li");
    li.dataset.id = t.train_id;
    li.classList.toggle("selected", t.train_id === selected);
    li.innerHTML = `<span class="what"><span class="name">${esc(trainName(t))}</span>` +
      (t.destination ? ` <span class="muted">to ${esc(t.destination)}</span>` : "") +
      `<span class="where">${t.operator ? `${esc(t.operator)}. ` : ""}${esc(whereText(t))}</span></span>` +
      `<span class="delay"><span class="dot" style="--c:${colour(delayClass(t))}"></span>${esc(delayText(t))}</span>` +
      `<div class="more"><div class="note">Loading its stops</div></div>`;
    li.classList.toggle("open", openTrain === t.train_id);
    li.onclick = e => {
      if (e.target.closest(".more")) return;
      const opening = openTrain !== t.train_id;
      openTrain = opening ? t.train_id : null;
      document.querySelectorAll("#list > li").forEach(x => x.classList.remove("open"));
      li.classList.toggle("open", opening);
      if (opening) openTrip(t.train_id);           // its stops and times, on the trip panel
    };
    if (openTrain === t.train_id) showJourney(li, t.train_id, null);
    return li;
  }));

  applyFocus();

  const latest = data.latest_message ? `feed ${time(data.latest_message)}` : "no feed messages yet";
  document.getElementById("status").textContent = data.total > trains.length
    ? `Showing ${trains.length} of ${data.total} trains in view: zoom in for the rest. ${latest}`
    : `${trains.length} train${trains.length === 1 ? "" : "s"} in view. ${latest}`;

  const op = document.getElementById("op");
  if (data.operators && op.options.length !== data.operators.length + 1) {
    const chosen = op.value;
    op.innerHTML = `<option value="">All operators</option>` +
      data.operators.map(o => `<option value="${esc(o.code)}">${esc(o.name)}</option>`).join("");
    op.value = chosen;
  }

  if (!fittedOnce && trains.length) {
    fittedOnce = true;
    if (selected && trainsById.has(selected)) select(selected, { zoom: true, popup: !linkedFocus });
  }
}

// Keep trains out from under the panel: it sits on the left on wide
// screens and along the bottom on phones.
function panelPadding() {
  const panel = document.getElementById("panel").getBoundingClientRect();
  const gap = 40;
  return window.innerWidth <= 600
    ? { paddingTopLeft: [gap, gap], paddingBottomRight: [gap, window.innerHeight - panel.top + gap] }
    : { paddingTopLeft: [panel.right + gap, gap], paddingBottomRight: [gap, gap] };
}

// Only the trains in (and just around) the part of the map on screen.
function trainQuery() {
  const b = map.getBounds().pad(0.2);
  if (focusing()) b.extend(routeGeo.bounds.pad(0.05));
  const q = new URLSearchParams({ bbox: [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()]
    .map(v => v.toFixed(3)).join(",") });
  const op = document.getElementById("op").value;
  if (op) q.set("op", op);
  return q;
}

// The static copy has every train in one file, so it filters here instead.
function filterHere(data, q) {
  const [west, south, east, north] = q.get("bbox").split(",").map(Number);
  const all = data.trains || [];
  const operators = [...new Map(all.filter(t => t.operator_code)
    .map(t => [t.operator_code, { code: t.operator_code, name: t.operator }])).values()]
    .sort((a, b) => (a.name || "").localeCompare(b.name || ""));
  const trains = all.filter(t => (!q.get("op") || t.operator_code === q.get("op")) &&
    t.lon >= west && t.lon <= east && t.lat >= south && t.lat <= north);
  return { ...data, trains: trains.slice(0, 600), total: trains.length, operators };
}

async function refresh() {
  if (STATIC && !liveUp()) {
    if (Date.now() - snapshotAt < 60e3) return;
    snapshotAt = Date.now();
  }
  let data;
  try {
    const q = trainQuery();
    data = await getJSON(`/api/trains?${q}`, { cache: "no-store" });
    if (STATIC) data = filterHere(data, q);
  } catch (err) {
    // Keep the last known positions on screen.
    showError("Can't reach the live trains right now. They'll reappear when the connection is back.");
    return;
  }
  render(data);
}

// Tapping the map's background: a train you're following stays (leave with

map.on("click", () => {

map.on("dblclick zoomstart movestart", () => clearTimeout(clearing));

document.getElementById("toggle").onclick = () => setSheet(

// ---- On phones the panel is a bottom sheet: drag its handle to resize ----
// Heights are fractions of the window; dragging it low folds it down to the
// tabs. Remembered between visits.
const SHEET_MIN = 150;          // px: any lower and it folds away
function sheetHeight() { return Number(localStorage.getItem("tt_sheet")) || 0.52; }
// A height for now, not remembered as your choice.
function peekSheet(height) {
  const panel = document.getElementById("panel");
  panel.classList.remove("collapsed");
  document.getElementById("toggle").textContent = "Hide";
  panel.style.setProperty("--sheet-h", `${Math.round(height * 100)}%`);
}
function setSheet(height) {
  const panel = document.getElementById("panel");
  const collapsed = height === "collapsed";
  panel.classList.toggle("collapsed", collapsed);
  document.getElementById("toggle").textContent = collapsed ? "Show" : "Hide";
  if (!collapsed) {
    panel.style.setProperty("--sheet-h", `${Math.round(height * 100)}%`);
    localStorage.setItem("tt_sheet", height);

}
(function () {
  const panel = document.getElementById("panel"), grab = document.getElementById("grab");
  let start = null;
  grab.addEventListener("pointerdown", e => {
    start = { y: e.clientY, h: panel.getBoundingClientRect().height, moved: false };
    grab.setPointerCapture(e.pointerId);
    panel.classList.add("dragging");
  });
  grab.addEventListener("pointermove", e => {
    if (!start) return;
    const h = start.h + (start.y - e.clientY);
    if (Math.abs(start.y - e.clientY) > 4) start.moved = true;
    if (!start.moved) return;
    panel.classList.remove("collapsed");
    panel.style.setProperty("--sheet-h", `${Math.max(h, 60)}px`);
  });
  const end = e => {
    if (!start) return;
    panel.classList.remove("dragging");
    if (!start.moved) {
      // A tap: fold open, or switch between half and nearly full height.
      setSheet(panel.classList.contains("collapsed") ? sheetHeight() : sheetHeight() > 0.7 ? 0.52 : 0.88);
    } else {
      const h = panel.getBoundingClientRect().height;
      setSheet(h < SHEET_MIN ? "collapsed" : Math.min(h / window.innerHeight, 0.95));
    }
    start = null;
  };
  grab.addEventListener("pointerup", end);
  grab.addEventListener("pointercancel", end);
  grab.addEventListener("keydown", e => {
    if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
    e.preventDefault();
    setSheet(Math.max(0.25, Math.min(0.95, sheetHeight() + (e.key === "ArrowUp" ? 0.1 : -0.1))));
  });
  setSheet(sheetHeight());
})();

// ---- Departures: the panel as a board for one station, the map focused on it ----
const params = new URLSearchParams(location.search);
const $id = id => document.getElementById(id);
let depStation = null, depTo = null, focusMarker = null;
const stationByCrs = crs => allStations.find(st => st.crs === crs);
const nameOfCrs = crs => stationByCrs(crs)?.name || crs;


let depKind = "departures";
function showTab(tab) {

    b.setAttribute("aria-pressed", String(b.dataset.tab === tab)));

function depStatus(d) {
  if (d.state === "cancelled") return ["verylate", "Cancelled"];
  if (d.state === "arrived" && depKind === "arrivals")
    return [d.delay_minutes > 0 ? (d.delay_minutes < VERY_LATE_MINUTES ? "late" : "verylate") : "ontime", "Arrived"];
  if (d.state === "departed") return [d.delay_minutes > 0 ? (d.delay_minutes < VERY_LATE_MINUTES ? "late" : "verylate") : "ontime", "Departed"];
  if (d.delay_minutes == null) return ["unknown", d.state === "not_set_up" ? "Not set up" : "No report"];
  if (d.delay_minutes < 0 && d.state === "running") return ["ontime", delayLabel(d.delay_minutes)];
  if (d.delay_minutes <= 0) return ["ontime", "On time"];
  return [d.delay_minutes < VERY_LATE_MINUTES ? "late" : "verylate", delayLabel(d.delay_minutes)];
}

function noteRow(text) {
  const li = document.createElement("li");
  li.className = "note-row";
  li.textContent = text;
  return li;
}
// A journey with changes: when it leaves and gets in, where you change, and
// how the first train is running.
function journeyRow(j, board) {
  const live = routeFirstTrain(j, board);
  const [cls, text] = live ? depStatus(live) : ["unknown", "Planned"];
  const li = document.createElement("li");
  li.className = "journey";
  li.style.setProperty("--c", colour(cls));
  const expected = live?.expected && time(live.expected) !== time(live.planned);
  li.innerHTML =
    `<span class="t">${expected ? `<span class="exp">${time(live.expected)}</span><s>${time(j.departs)}</s>` : time(j.departs)}</span>` +
    `<span><span class="d">Arrives ${time(j.arrives)}</span><span class="o">${esc(routeSummary(j))}</span></span>` +
    `<span class="s" style="color:${colour(cls)}">${esc(text)}${live?.platform ? `<small>Plat ${esc(live.platform)}</small>` : ""}</span>` +
    `<div class="legs">${routeLegsHtml(j, board)}</div>`;
  li.onclick = () => { if (live?.train_id) focusTrain(live); };
  return li;
}

let depLoads = 0;          // only the latest load draws
async function loadDepartures() {
  if (!depStation) return;
  const n = ++depLoads;
  let data;
  try {
    data = await getJSON(`/api/board?${new URLSearchParams({ station: depStation, to: "all", limit: "40", kind: depKind })}`,
                         { cache: "no-store" });
  } catch (err) { return; }
  if (n !== depLoads) return;
  const list = $id("deps");
  if (data.error) { list.innerHTML = `<li class="empty">${esc(data.error)}</li>`; return; }
  const arriving = depKind === "arrivals";
  // Operators on this board, for the filter.
  const opSel = $id("dep-op");
  const opInfo = operators.find(o => o.code === opSel.value);
  const rows = data.departures
    .filter(d => !depTo || (arriving ? (d.calls_before || []).includes(depTo) : d.calls_after.some(c => c.crs === depTo)))
    .filter(d => !opSel.value || d.operator_code === opSel.value).slice(0, 20);
  $id("dep-title").textContent = `${data.station} ${arriving ? "arrivals" : "departures"}`;
  const which = depTo ? `${arriving ? "From" : "To"} ${nameOfCrs(depTo)}` : "All trains";
  $id("dep-sub").textContent = `${which}${opSel.value ? `, ${opSel.selectedOptions[0].text}` : ""}. ` +
    (data.slim ? `Hourly snapshot from ${time(data.generated_at)}` : `Updated ${time(data.generated_at)}`);
  if (!rows.length && opInfo && !opInfo.stations.includes(depStation)) {
    list.innerHTML = `<li class="empty">${esc(opInfo.name)} doesn't call at ${esc(data.station)}. ` +
      `Pick one of its stations in From: the suggestions now only show its ${opInfo.stations.length} stations.</li>`;
    return;
  }
  // With a destination: journeys with a change too, when nothing goes direct
  // or a change gets there sooner.
  const routes = depTo && !arriving && !opSel.value ? await findRoutes(depStation, depTo) : [];
  if (n !== depLoads) return;
  const directArrival = d => {
    const c = d.calls_after.find(c => c.crs === depTo);
    const late = d.state !== "cancelled" && d.delay_minutes > 0 ? d.delay_minutes : 0;
    return c ? new Date(c.planned).getTime() + late * 60e3 : Infinity;
  };
  const firstDirect = rows.filter(d => d.state !== "cancelled").map(directArrival).sort((a, b) => a - b)[0] ?? Infinity;
  const faster = routes.filter(j => j.changes && new Date(j.arrives).getTime() < firstDirect - 2 * 60e3).slice(0, rows.length ? 1 : 4);
  if (!rows.length && faster.length) {
    list.replaceChildren(noteRow(`No direct trains to ${nameOfCrs(depTo)}: fastest with a change`),
                         ...faster.map(j => journeyRow(j, data.departures)));
    return;
  }
  if (!rows.length && guessedTo && depTo === guessedTo && !userChose) {
    // Guessed from where you are, but nothing goes straight there: show everything.
    const name = nameOfCrs(depTo);
    guessedTo = null;
    setDepartures(depStation, null, false);
    $id("dep-why").textContent += ` (no direct trains to ${name}, so all departures)`;
    return;
  }
  if (!rows.length) {
    list.innerHTML = `<li class="empty">No ${arriving ? "arrivals" : "direct trains"}` +
      `${depTo ? ` ${arriving ? "from" : "to"} ${esc(nameOfCrs(depTo))}` : ""}${opSel.value ? " for that operator" : ""} in the next few hours.</li>`;
    return;
  }
  const extra = faster.length ? [noteRow("Faster with a change"), ...faster.map(j => journeyRow(j, data.departures)),
                                  noteRow(`Direct to ${nameOfCrs(depTo)}`)] : [];
  list.replaceChildren(...extra, ...rows.map(d => {
    const [cls, text] = depStatus(d);
    const expected = d.expected && time(d.expected) !== time(d.planned) && d.state !== "departed";
    const li = document.createElement("li");
    li.style.setProperty("--c", colour(cls));
    li.classList.toggle("selected", !!d.train_id && d.train_id === selected);
    const key = d.planned + d.origin;
    li.classList.toggle("open", openDeparture === key);
    li.innerHTML =
      `<span class="t">${expected ? `<span class="exp">${time(d.expected)}</span><s>${time(d.planned)}</s>` : time(d.planned)}</span>` +
      (arriving
        ? `<span><span class="d">From ${esc(d.origin)}</span>` +
          `<span class="o">${d.destination === data.station ? "Terminates here" : `Going on to ${esc(d.destination)}`}` +
          `${d.operator ? `. ${esc(d.operator)}` : ""}</span></span>`
        : `<span><span class="d">${esc(d.destination)}${d.via ? `, circular via ${esc(d.via)}` : ""}</span>` +
          `<span class="o">${d.origin === data.station ? "Starts here" : `From ${esc(d.origin)} ${time(d.origin_dep_time)}`}` +
          `${d.operator ? `. ${esc(d.operator)}` : ""}</span></span>`) +
      `<span class="s" style="color:${colour(cls)}">${esc(text)}${d.platform ? `<small>Plat ${esc(d.platform)}</small>` : ""}</span>` +
      `<div class="more">${plannedJourneyHtml(d, depStation)}</div>`;
    li.onclick = e => {
      if (e.target.closest(".more")) return;
      const opening = openDeparture !== key;
      openDeparture = opening ? key : null;
      document.querySelectorAll("#deps > li").forEach(x => x.classList.remove("open"));
      li.classList.toggle("open", opening);
      if (opening) {
        focusTrain(d);
        showJourney(li, d.train_id, depStation);
      }
    };
    if (openDeparture === key) showJourney(li, d.train_id, depStation);
    return li;
  }));
}

let openDeparture = null, openTrain = null;

// Show a departure's train on the map: its route, and the train itself once it's in view.

// ---- Where you are: the station you most likely want to leave from ----
// Near work: from work, towards home. Near home: from home, towards work on
// a weekday morning, otherwise anywhere (you might be going somewhere else).
// Anywhere else: your nearest station, towards home.
let userChose = false, guessedTo = null;
const chosen = () => { userChose = true; $id("dep-why").textContent = ""; };
function useLocation(asked) {
  if (!navigator.geolocation || !window.isSecureContext) {
    if (asked) $id("dep-why").textContent = "Location needs the secure (https) site.";
    return;
  }
  if (asked) $id("dep-why").textContent = "Finding you…";
  navigator.geolocation.getCurrentPosition(p => {
    showHere(p.coords);
    if (!asked && userChose) return;        // you've picked a station since
    const trip = likelyTrip({ lat: p.coords.latitude, lon: p.coords.longitude }, allStations);
    if (!trip) { $id("dep-why").textContent = asked ? "No station within 30 km of you." : ""; return; }
    if (asked) { ttSettings.set("use_location", true); userChose = false; }
    watchMe();
    guessedTo = trip.to;
    setDepartures(trip.from, trip.to);
    $id("dep-why").textContent = trip.why;
  }, err => {
    if (asked) $id("dep-why").textContent = err.code === 1 ? "Location is blocked for this site." : "Couldn't find you.";
  }, { maximumAge: 5 * 60e3, timeout: 10e3 });
}
$id("dep-near").onclick = () => useLocation(true);

// Follow you as you move (once location is allowed).
let watching = null, hereFix = null;
function watchMe() {
  if (watching !== null || !navigator.geolocation || !window.isSecureContext) return;
  watching = navigator.geolocation.watchPosition(p => showHere(p.coords), () => {},
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
}

// ---- Trains keep moving between updates ----
// Each train's `move` is the stretch of track it's on (or about to leave on),
// with when it left and should arrive at its current lateness, and how far
// along it may go before its next report. Positions are recomputed from that
// every couple of seconds.
// You on the train you picked: when you're on its line, near where we think
// it is, your phone is the best guide to where it really is.
function onBoard(t) {
  // Only once we know you're on it: moving at train speed, matched to this
  // train (spotMyTrain). Standing on the platform, you're on its line too, and
  // it would be drawn at the station before it gets there.
  // Once it's known, wherever you are on its line is where it is, stopped or
  // not: reports lag behind, and our estimate from them can be well out.
  if (!hereFix || t.train_id !== selected || !routeGeo || routeGeo.id !== t.train_id || Date.now() - hereFix.at > 60e3) return null;
  if (!myLocked || myTrain?.train_id !== t.train_id) return null;
  const me = project(routeGeo, hereFix.lat, hereFix.lon);
  return me.dist <= 250 ? { lat: hereFix.lat, lon: hereFix.lon, heading: me.bearing } : null;
}
function glide() {
  const now = Date.now();
  let turned = false;
  for (const [id, m] of markers) {
    const t = trainsById.get(id);
    if (!t) continue;
    const p = onBoard(t) || glidePosition(t, now);
    if (!p) continue;
    m.setLatLng([p.lat, p.lon]);
    t._shown = p;
    if (p.heading != null && Math.abs(((p.heading - (t.heading ?? p.heading)) + 540) % 360 - 180) > 15) {
      t.heading = Math.round(p.heading);
      m.setIcon(icon(t));          // a new icon is shown again: hide it again below if it should be
      turned = true;
    }
  }
  if (turned && focusing()) applyFocus();
  keepTrainCentred();
}
setInterval(() => { glide(); spotMyTrain(); }, 2000);

// ---- Which train you're on ----
// Found from your location: moving at train speed, with a train where you
// are going your way, twice running. Then kept: slowing, stopping at a signal
// or a station, or another train's icon being nearer at a junction doesn't
// change it. Let go when you're well off its line for half a minute (you got
// off), or it's gone from the map (finished) for 10 minutes. Shared with the
// Tracker's "On your train" (tt_mytrain), so both pages agree.
const MINE_KEY = "tt_mytrain", OFF_LINE_M = 500, OFF_LINE_CHECKS = 15, GONE_MS = 10 * 60e3;
let myTrain = null, myTrainSeen = 0, myLocked = false, offLine = 0, mineLastSeen = 0;
function savedMine() {
  try {
    const m = JSON.parse(localStorage.getItem(MINE_KEY) || "null");
    return m && Date.now() - m.at < 3 * 3600e3 ? m : null;
  } catch (e) { return null; }
}
function lockMine(t) {
  const before = savedMine();
  myLocked = true; offLine = 0; mineLastSeen = Date.now();
  localStorage.setItem(MINE_KEY, JSON.stringify({ id: t.train_id, headcode: t.headcode,
    boardedAt: before?.id === t.train_id ? before.boardedAt : null, at: Date.now() }));
}
function unlockMine() {
  myLocked = false; myTrain = null; myTrainSeen = 0; offLine = 0;
  localStorage.removeItem(MINE_KEY);
}
function spotMyTrain() {
  const chip = document.getElementById("onboard");
  const saved = savedMine();
  if (saved && (!myLocked || saved.id !== myTrain?.train_id)) {
    // Already known (here or on the Tracker).
    myLocked = true; myTrainSeen = 2; offLine = 0; mineLastSeen = Date.now();
    myTrain = trainsById.get(saved.id) || { train_id: saved.id, headcode: saved.headcode };
  } else if (!saved && myLocked) {
    myLocked = false; myTrain = null; myTrainSeen = 0;      // let go on the Tracker ("Not my train")
  }
  if (myLocked) {
    const now = trainsById.get(myTrain.train_id);
    if (now) { myTrain = now; mineLastSeen = Date.now(); }
    else if (Date.now() - mineLastSeen > GONE_MS) unlockMine();
    // Off its line for a while: you've got off.
    if (myLocked && hereFix && Date.now() - hereFix.at < 60e3 && routeGeo?.id === myTrain.train_id) {
      const d = project(routeGeo, hereFix.lat, hereFix.lon).dist;
      offLine = d > OFF_LINE_M ? offLine + 1 : 0;
      if (offLine >= OFF_LINE_CHECKS) unlockMine();
      else if (d <= 250) sharePosition(myTrain.train_id, hereFix);      // so others see where it really is
    }
  } else {
    const best = spotTrain(hereFix, [...trainsById.values()]);
    // The same train twice in a row before saying so.
    myTrainSeen = best && best.train_id === myTrain?.train_id ? myTrainSeen + 1 : (best ? 1 : 0);
    myTrain = best;
    if (myTrain && myTrainSeen >= 2) lockMine(myTrain);
  }
  const known = myLocked && trainsById.has(myTrain?.train_id);
  // Follow it, unless you've gone back to departures.
  if (known && autoFollow && tripTrain !== myTrain.train_id) followTrain(myTrain);
  const following = tripMode && selected === myTrain?.train_id;
  chip.hidden = !known || following;
  if (!chip.hidden) {
    document.getElementById("onboard-text").textContent =
      `You're on the ${trainName(myTrain)}${myTrain.destination ? ` to ${myTrain.destination}` : ""}`;
  }
}
document.getElementById("onboard-follow").onclick = () => { if (myTrain) { autoFollow = true; followTrain(myTrain); } };

// You, as a blue dot (with how sure the phone is), whenever we have a fix.
let hereDot = null, hereRing = null;
function showHere(c) {
  const at = [c.latitude, c.longitude];
  hereFix = nextFix(hereFix, c);
  if (!hereDot) {
    hereRing = L.circle(at, { radius: c.accuracy || 50, color: "#1a73e8", weight: 1, opacity: .4,
                              fillColor: "#1a73e8", fillOpacity: .1, interactive: false }).addTo(map);
    hereDot = L.circleMarker(at, { radius: 7, color: "#fff", weight: 2.5, fillColor: "#1a73e8", fillOpacity: 1 })
      .bindTooltip("You", { direction: "top", offset: [0, -8] }).addTo(map);
  }
  hereDot.setLatLng(at);
  hereRing.setLatLng(at).setRadius(Math.min(c.accuracy || 50, 2000));
}

async function setupDepartures() {
  await loadStations();
  operators = (await getJSON("/api/operators").catch(() => ({}))).operators || [];
  $id("dep-op").innerHTML = `<option value="">All operators</option>` +
    operators.map(o => `<option value="${esc(o.code)}">${esc(o.name)}</option>`).join("");
  fromPicker = stationPicker($id("dep-from"), $id("dep-from-list"), {
    stations: offeredStations, onPick: crs => { if (crs) { chosen(); setDepartures(crs, depTo); } } });
  toPicker = stationPicker($id("dep-to"), $id("dep-to-list"), {
    stations: offeredStations, optional: true, emptyLabel: "Anywhere",
    onPick: crs => { chosen(); setDepartures(depStation, crs, false); } });
  let station = params.get("station"), to = params.get("to");
  if (!station) {
    const config = await getJSON("/api/config").catch(() => ({}));
    const token = localStorage.getItem("tt_token");
    const prefs = ACCOUNTS && token
      ? (await accountJSON(`/api/account?token=${encodeURIComponent(token)}`).catch(() => ({}))).subscription?.prefs
      : null;
    const mine = ttSettings.get("board_from");
    station = mine || prefs?.board_station || config.station || "BCS";
    to = mine ? ttSettings.get("board_to") : prefs ? prefs.board_to : config.towards;
  }
  // A train in the link (from the board's "Show on map") wins over the station.
  setDepartures(station, to, !params.get("train"));
  // Then, if you allow it, the station where you are.
  if (await locationAllowed()) watchMe();        // the blue dot, following you
  if (!params.get("station") && !params.get("train")) {
    if (await locationAllowed()) useLocation(false);
  }
  setInterval(loadDepartures, 30000);
}

addBaseMap();
setupDepartures();
// A train in the link: draw its route and fit the map to it straight away,
// even if it's outside the map's first view.
if (selected) {
  // From a tile: fold the panel down so the journey fills the screen (not remembered).
  if (tripMode && window.innerWidth <= 640) setSheet("collapsed");   // opened part-way once the trip loads
  select(selected, { zoom: true, popup: false });
}
labelVisibility();
refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
